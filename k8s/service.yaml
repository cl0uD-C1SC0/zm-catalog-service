# Dentro do cluster: http://catalog-service:8000  (é assim que o os-service chama)
# De fora (na VM):   http://$(minikube ip):30081/docs
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: zm
spec:
  type: NodePort
  selector:
    app: catalog-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
