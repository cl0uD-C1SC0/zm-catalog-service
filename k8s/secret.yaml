# Credenciais de ambiente de estudo (as mesmas do docker-compose).
# O catalog_user só tem GRANT no schema catalog_db (ver k8s-infra/mysql).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-service-sec
  namespace: zm
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://catalog_user:catalog_pass@mysql:3306/catalog_db"
